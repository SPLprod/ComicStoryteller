<div id="game-option">
    <div id="difficulty-option">
        <label for="rating1">1</label>
        <input type="radio" name="rating" value="1" id="rating1"/>
        <label for="rating1">2</label>
        <input type="radio" name="rating" value="2" id="rating2" />
        <label for="rating1">3</label>
        <input type="radio" name="rating" value="3" id="rating3" />
        <label for="rating1">4</label>
        <input type="radio" name="rating" value="4" id="rating4" />
        <label for="rating1">5</label>
        <input type="radio" name="rating" value="5" id="rating5" />
    </div>
    
    <div id="theme-option"></div>
    
    <div id="bonuses">
        <div id="goal-option"></div>
        <div id="restriction"></div>
    </div>
    
    <div id="extra-option">
        <label for="page-number"><i class="fa-solid fa-file"></i></label>
        <input type="number" name="page-number" id="page-number" min="1" max="20" value="1">
        <label for="timer"><i class="fa-solid fa-stopwatch"></i></label>
        <input type="checkbox" name="timer" id="timer" >
    </div>
</div>
